# Sauvegarde quotidienne de la base Supabase (le plan gratuit n'en fait aucune).
# La copie est chiffrée avant d'être rangée dans GitHub : le dépôt est public, les données des joueurs ne doivent
# jamais y être lisibles. Elle est gardée 30 jours, dans l'onglet Actions (« Sauvegarde de la base »).
#
# Deux secrets à créer une fois dans GitHub (Settings › Secrets and variables › Actions) :
#   SUPABASE_DB_PASSWORD : le mot de passe du compte « backup_reader » (lecture seule), choisi par vous et activé une fois
#     dans l'éditeur SQL de Supabase :  alter role backup_reader login password 'le-même-mot-de-passe';
#   BACKUP_PASSPHRASE : une longue phrase secrète, à garder aussi ailleurs : sans elle, la copie est illisible
# L'adresse de la base est construite ici (projet et région connus) : pas besoin de la copier depuis Supabase.
# Tant que les secrets manquent, la sauvegarde échoue (croix rouge) : une coche verte veut toujours dire « copie faite ».
#
# Restaurer : télécharger l'archive, puis
#   gpg --decrypt market-empire-AAAA-MM-JJ.sql.gz.gpg | gunzip > sauvegarde.sql
name: Sauvegarde de la base

on:
  schedule:
    - cron: "17 3 * * *" # chaque nuit vers 5 h (heure de Paris)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      # Projet Supabase « Market Empire » (Francfort). Connexion par le « pooler » : GitHub n'a pas d'IPv6.
      # Compte en lecture seule réservé à la sauvegarde (voir supabase/migrations/20261013b_backup_reader.sql)
      PGUSER: backup_reader.elpkixotuarcymalehjs
      PGDATABASE: postgres
      PGPORT: "5432"
    steps:
      - name: Vérifier la configuration
        id: config
        run: |
          if [ -z "$PGPASSWORD" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            [ -z "$PGPASSWORD" ] && echo "::error::Secret manquant : SUPABASE_DB_PASSWORD (Settings › Secrets and variables › Actions › Repository secrets)."
            [ -z "$BACKUP_PASSPHRASE" ] && echo "::error::Secret manquant : BACKUP_PASSPHRASE (Settings › Secrets and variables › Actions › Repository secrets)."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # La base est en PostgreSQL 17 : il faut l'outil de copie de la même version
      - name: Installer pg_dump 17
        if: steps.config.outputs.ready == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      # Selon l'âge du projet, Supabase l'a rangé derrière l'un de ces deux serveurs : on prend celui qui répond
      # Le message exact de chaque essai est affiché (jamais le mot de passe) : « password authentication failed » = mauvais
      # mot de passe, « Tenant or user not found » = pas le bon serveur.
      - name: Trouver le serveur de la base
        if: steps.config.outputs.ready == 'true'
        run: |
          # Un espace ou un retour à la ligne copié avec le mot de passe suffit à le rendre faux
          PW="$(printf '%s' "$PGPASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          echo "::add-mask::$PW"
          echo "PGPASSWORD=$PW" >> "$GITHUB_ENV"
          export PGPASSWORD="$PW" PGSSLMODE=require PGCONNECT_TIMEOUT=15
          for h in aws-0-eu-central-1.pooler.supabase.com aws-1-eu-central-1.pooler.supabase.com; do
            if out=$(/usr/lib/postgresql/17/bin/psql -h "$h" -tAc "select 1" 2>&1); then
              echo "PGHOST=$h" >> "$GITHUB_ENV"; echo "PGSSLMODE=require" >> "$GITHUB_ENV"; echo "Serveur : $h"; exit 0
            fi
            echo "Essai $h : $out"
          done
          echo "::error::Connexion impossible à la base. Si les essais disent « password authentication failed », le secret SUPABASE_DB_PASSWORD n'est pas le mot de passe donné à backup_reader dans l'éditeur SQL de Supabase."
          exit 1

      # Les tables du jeu (structure et données) et les comptes des joueurs (données seulement)
      - name: Copier la base
        if: steps.config.outputs.ready == 'true'
        run: |
          set -o pipefail
          FILE="market-empire-$(date -u +%F).sql.gz"
          {
            /usr/lib/postgresql/17/bin/pg_dump --schema=public --no-owner --no-privileges
            /usr/lib/postgresql/17/bin/pg_dump --data-only --table=auth.users --table=auth.identities --no-owner --no-privileges
          } | gzip -9 > "$FILE"
          test "$(stat -c %s "$FILE")" -gt 1000
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Chiffrer la copie
        if: steps.config.outputs.ready == 'true'
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 "$FILE"
          rm "$FILE"

      - uses: actions/upload-artifact@v4
        if: steps.config.outputs.ready == 'true'
        with:
          name: sauvegarde-${{ github.run_id }}
          path: market-empire-*.sql.gz.gpg
          retention-days: 30
          if-no-files-found: error
